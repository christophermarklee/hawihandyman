<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Hawi Handyman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <form method="post" action="/app/login" class="bg-white rounded-2xl shadow p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-bold text-slate-900">Hawi Handyman</h1>
    <p class="text-sm text-slate-500">Enter your password to open HaleClock.</p>
    {% if error %}<p class="text-sm text-red-600 font-semibold">{{ error }}</p>{% endif %}
    <input type="password" name="password" required autofocus
           class="w-full h-12 rounded-xl border border-slate-300 px-4 text-lg"
           placeholder="Password">
    <button class="w-full h-12 rounded-xl bg-emerald-700 text-white text-lg font-bold">Log in</button>
  </form>
</body>
</html>
