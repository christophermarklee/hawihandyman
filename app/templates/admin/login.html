<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Hawi Handyman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <main class="bg-white rounded-2xl shadow p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-bold text-slate-900">Hawi Handyman</h1>
    <p class="text-sm text-slate-500">Sign in with an authorized Google account to open HaleClock.</p>
    {% if error %}<p class="text-sm text-red-600 font-semibold">{{ error }}</p>{% endif %}
    {% if google_enabled %}
      <a href="/app/login/google"
         class="block w-full h-12 rounded-xl bg-emerald-700 text-center leading-[48px] text-white text-lg font-bold">
        Continue with Google
      </a>
    {% endif %}
  </main>
</body>
</html>
