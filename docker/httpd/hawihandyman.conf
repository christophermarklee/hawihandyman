Listen 443 https

<VirtualHost *:80>
    ServerName hawihandyman.com
    ServerAlias www.hawihandyman.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName hawihandyman.com
    ServerAlias www.hawihandyman.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hawihandyman.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hawihandyman.com/privkey.pem

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    # HaleClock (FastAPI on localhost): admin app, booking, invoices, APIs.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /app http://127.0.0.1:8000/app
    ProxyPassReverse /app http://127.0.0.1:8000/app
    ProxyPass /book http://127.0.0.1:8000/book
    ProxyPassReverse /book http://127.0.0.1:8000/book
    ProxyPass /account http://127.0.0.1:8000/account
    ProxyPassReverse /account http://127.0.0.1:8000/account
    ProxyPass /i http://127.0.0.1:8000/i
    ProxyPassReverse /i http://127.0.0.1:8000/i
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
