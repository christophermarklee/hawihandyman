name: Build and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hawihandyman-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run application tests
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest tests/ -q

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --tag "$REGISTRY/hawihandyman:$IMAGE_TAG" .
          docker push "$REGISTRY/hawihandyman:$IMAGE_TAG"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform/site
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=hawihandyman/site.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
          terraform -chdir=terraform/site validate

      - name: Apply site infrastructure
        working-directory: terraform/site
        env:
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          TF_VAR_haleclock_admin_password: ${{ secrets.HALECLOCK_ADMIN_PASSWORD }}
          TF_VAR_haleclock_secret_key: ${{ secrets.HALECLOCK_SECRET_KEY }}
        run: terraform apply -auto-approve
